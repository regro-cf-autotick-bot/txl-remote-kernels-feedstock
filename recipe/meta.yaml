{% set python_min = "3.10" %}
{% set name = "txl-remote-kernels" %}
{% set version = "0.3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/txl_remote_kernels-{{ version }}.tar.gz
  sha256: 89b8af7e0ffcb0176139a48e56b398f23ff848b12d676d7e7eaeb07d3a13cad7

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2
    - txl-kernel >=0.3.6
    - httpx >=0.23.1
    - httpx-ws >=0.4.2
    - pycrdt >=0.10.9,<0.13.0

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_remote_kernels

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/remote_kernels
  summary: TXL plugin for remote kernels
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/remote_kernels
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
